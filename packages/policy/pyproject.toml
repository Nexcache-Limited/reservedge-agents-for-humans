[project]
name = "itaa-policy"
version = "0.0.0"
description = "Cloud-neutral ITAA disclosure, hashing, approval, isolation, and idempotency policy."
requires-python = ">=3.12,<3.13"
dependencies = ["itaa-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_policy"]

[tool.uv.sources]
itaa-domain = { workspace = true }
