[project]
name = "itaa-ranking"
version = "0.0.0"
description = "Cloud-neutral deterministic airport-parking ranking and explanation facts."
requires-python = ">=3.12,<3.13"
dependencies = ["itaa-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_ranking"]

[tool.uv.sources]
itaa-domain = { workspace = true }
