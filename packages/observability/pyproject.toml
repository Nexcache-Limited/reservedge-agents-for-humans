[project]
name = "itaa-observability"
version = "0.0.0"
description = "Cloud-neutral ITAA audit vocabulary and redaction-safe append ports."
requires-python = ">=3.12,<3.13"
dependencies = ["itaa-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_observability"]

[tool.uv.sources]
itaa-domain = { workspace = true }
