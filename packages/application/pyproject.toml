[project]
name = "itaa-application"
version = "0.0.0"
description = "Cloud-neutral ITAA application ports and use-case package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "itaa-domain",
    "itaa-policy",
    "itaa-observability",
    "itaa-ranking",
    "itaa-contracts-generated",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_application"]

[tool.uv.sources]
itaa-domain = { workspace = true }
itaa-policy = { workspace = true }
itaa-observability = { workspace = true }
itaa-ranking = { workspace = true }
itaa-contracts-generated = { workspace = true }
