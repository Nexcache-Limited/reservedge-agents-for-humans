<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="title desc">
  <title id="title">Reservedge architecture — AWS Agents for Humans</title>
  <desc id="desc">Human buyer to Booking Chat UI to product BFF /v1/agent to /v1/aws plan-turns and execute-turns to Strands Agents SDK to Amazon Bedrock to a code projector. Capabilities: LiteAPI sandbox flight and stay search, simulated Curated parking offers with a simulated receipt, and Prioticket experience search. The browser never calls Bedrock. AgentCore is not deployed.</desc>
  <rect width="1180" height="820" fill="#f7f4ef"/>
  <text x="40" y="36" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c1916">Reservedge — Intent-to-Action booking agent</text>
  <text x="40" y="58" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#5c574f">Everyday Agents · Strands Agents SDK + Amazon Bedrock · browser never calls Bedrock · AgentCore not deployed</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d3a34"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">
    <rect x="40" y="80" width="200" height="64" rx="8" fill="#f4f0e6" stroke="#3d3a34"/>
    <text x="140" y="108" text-anchor="middle" font-weight="700">Human buyer</text>
    <text x="140" y="128" text-anchor="middle" font-size="11" fill="#5c574f">objective · grants</text>

    <rect x="280" y="80" width="280" height="64" rx="8" fill="#e7f0ea" stroke="#2f5d50"/>
    <text x="420" y="108" text-anchor="middle" font-weight="700">Responsive Reservedge UI</text>
    <text x="420" y="128" text-anchor="middle" font-size="11" fill="#2f5d50">Booking Chat · domain lanes</text>

    <rect x="600" y="80" width="240" height="64" rx="8" fill="#e8eef7" stroke="#314a73"/>
    <text x="720" y="108" text-anchor="middle" font-weight="700">Product BFF</text>
    <text x="720" y="128" text-anchor="middle" font-size="11" fill="#314a73">/v1/agent/**</text>

    <rect x="880" y="80" width="260" height="64" rx="8" fill="#e8eef7" stroke="#314a73"/>
    <text x="1010" y="104" text-anchor="middle" font-weight="700">/v1/aws/plan-turns</text>
    <text x="1010" y="124" text-anchor="middle" font-size="11" fill="#314a73">/v1/aws/execute-turns</text>
  </g>
  <g fill="none" stroke="#3d3a34" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="240" y1="112" x2="280" y2="112"/>
    <line x1="560" y1="112" x2="600" y2="112"/>
    <line x1="840" y1="112" x2="880" y2="112"/>
  </g>

  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">
    <rect x="280" y="180" width="280" height="72" rx="8" fill="#e8eef7" stroke="#314a73"/>
    <text x="420" y="208" text-anchor="middle" font-weight="700">Strands Agents SDK</text>
    <text x="420" y="228" text-anchor="middle" font-size="11" fill="#314a73">interpret · clarify · refine</text>

    <rect x="600" y="180" width="240" height="72" rx="8" fill="#e8eef7" stroke="#314a73"/>
    <text x="720" y="208" text-anchor="middle" font-weight="700">Amazon Bedrock</text>
    <text x="720" y="228" text-anchor="middle" font-size="11" fill="#314a73">hosted staging is live</text>
  </g>
  <g fill="none" stroke="#3d3a34" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="1010" y1="144" x2="1010" y2="216"/>
    <line x1="1010" y1="216" x2="840" y2="216"/>
    <line x1="560" y1="216" x2="600" y2="216"/>
    <line x1="420" y1="252" x2="420" y2="292"/>
  </g>

  <rect x="40" y="292" width="1100" height="96" rx="10" fill="#f7ead8" stroke="#8a5a12"/>
  <text x="590" y="324" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c1916">Code projector / governance</text>
  <text x="590" y="348" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#8a5a12">Explicit · Inferred · Proposed · authorization · isolation · ranking</text>
  <text x="590" y="368" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#8a5a12">Code owns money-sensitive state. The model cannot skip a human grant.</text>

  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#1c1916">
    <rect x="40" y="428" width="250" height="88" rx="8" fill="#eee9e2" stroke="#6b645b"/>
    <text x="165" y="456" text-anchor="middle" font-weight="700">flight.search</text>
    <text x="165" y="476" text-anchor="middle" fill="#5c574f">LiteAPI sandbox research</text>
    <text x="165" y="496" text-anchor="middle" font-size="11" fill="#5c574f">not a ticket</text>

    <rect x="310" y="428" width="250" height="88" rx="8" fill="#eee9e2" stroke="#6b645b"/>
    <text x="435" y="456" text-anchor="middle" font-weight="700">stay.search</text>
    <text x="435" y="476" text-anchor="middle" fill="#5c574f">LiteAPI sandbox research</text>
    <text x="435" y="496" text-anchor="middle" font-size="11" fill="#5c574f">not a reservation</text>

    <rect x="580" y="428" width="250" height="88" rx="8" fill="#f3e6d8" stroke="#8a5a12"/>
    <text x="705" y="456" text-anchor="middle" font-weight="700">parking.search</text>
    <text x="705" y="476" text-anchor="middle" fill="#8a5a12">simulated Curated offers</text>
    <text x="705" y="496" text-anchor="middle" font-size="11" fill="#8a5a12">no live marketplace</text>

    <rect x="850" y="428" width="290" height="88" rx="8" fill="#eee9e2" stroke="#6b645b"/>
    <text x="995" y="456" text-anchor="middle" font-weight="700">experience.search</text>
    <text x="995" y="476" text-anchor="middle" fill="#5c574f">Prioticket</text>
    <text x="995" y="496" text-anchor="middle" font-size="11" fill="#5c574f">provider-limited catalog</text>
  </g>
  <g fill="none" stroke="#8a5a12" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="165" y1="388" x2="165" y2="428"/>
    <line x1="435" y1="388" x2="435" y2="428"/>
    <line x1="705" y1="388" x2="705" y2="428"/>
    <line x1="995" y1="388" x2="995" y2="428"/>
    <line x1="705" y1="516" x2="705" y2="548"/>
  </g>

  <rect x="520" y="548" width="370" height="72" rx="8" fill="#f3e6d8" stroke="#8a5a12"/>
  <text x="705" y="578" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1916">Governed simulated action</text>
  <text x="705" y="600" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#8a5a12">SIMULATED receipt — no real charge or reservation</text>

  <rect x="40" y="648" width="1100" height="140" rx="10" fill="#fff" stroke="#3d3a34"/>
  <text x="56" y="678" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1916">Legend</text>
  <text x="56" y="704" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">Sandbox research = external provider research, no booking/ticket</text>
  <text x="56" y="728" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">Simulated Curated = no real supplier or reservation</text>
  <text x="56" y="752" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">Human authorization at consequential transitions</text>
  <text x="56" y="776" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#5c574f">rental.search is requirement-only (no production inventory adapter). AgentCore is not deployed.</text>
</svg>
