[project]
name = "itaa-validate-contracts"
version = "0.0.0"
description = "Canonical JSON Schema validation, generation, and drift checks for ITAA contracts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "datamodel-code-generator==0.31.2",
    "jsonschema==4.25.0",
    "pydantic==2.12.5",
]

[project.scripts]
itaa-validate-contracts = "itaa_validate_contracts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_validate_contracts"]
