[project]
name = "itaa-api"
version = "0.0.0"
description = "Local-only FastAPI composition root for the simulated airport-parking golden path."
requires-python = ">=3.12,<3.13"
dependencies = [
    "itaa-application",
    "itaa-domain",
    "itaa-policy",
    "itaa-observability",
    "itaa-ranking",
    "itaa-contracts-generated",
    "itaa-supplier-simulator",
    "fastapi==0.133.0",
    "httpx==0.28.1",
    "uvicorn==0.35.0",
]

[project.scripts]
itaa-export-openapi = "itaa_api.export_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_api"]

[tool.uv.sources]
itaa-application = { workspace = true }
itaa-domain = { workspace = true }
itaa-policy = { workspace = true }
itaa-observability = { workspace = true }
itaa-ranking = { workspace = true }
itaa-contracts-generated = { workspace = true }
itaa-supplier-simulator = { workspace = true }
