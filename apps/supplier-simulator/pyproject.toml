[project]
name = "itaa-supplier-simulator"
version = "0.0.0"
description = "Isolated deterministic simulated suppliers. Not a real marketplace."
requires-python = ">=3.12,<3.13"
dependencies = [
    "itaa-application",
    "itaa-policy",
    "itaa-domain",
    "itaa-contracts-generated",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_supplier_simulator"]

[tool.uv.sources]
itaa-application = { workspace = true }
itaa-policy = { workspace = true }
itaa-domain = { workspace = true }
itaa-contracts-generated = { workspace = true }
