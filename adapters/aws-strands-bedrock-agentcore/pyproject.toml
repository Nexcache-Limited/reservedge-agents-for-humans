[project]
name = "itaa-aws-adapter"
version = "0.1.0"
description = "Competition-specific AWS Strands/Bedrock adapter around the cloud-neutral ITAA core."
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "itaa-application",
    "itaa-api",
    "itaa-domain",
    "itaa-liteapi-hotels",
    "itaa-prioticket-experiences",
    "fastapi==0.133.0",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
live = ["strands-agents==1.54.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_aws_adapter"]

[tool.uv.sources]
itaa-application = { workspace = true }
itaa-api = { workspace = true }
itaa-domain = { workspace = true }
itaa-liteapi-hotels = { workspace = true }
itaa-prioticket-experiences = { workspace = true }
