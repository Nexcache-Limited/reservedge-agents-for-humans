[project]
name = "itaa-liteapi-hotels"
version = "0.1.0"
description = "Competition-only LiteAPI/Nuitee stay-search adapter behind ExternalSearchPort."
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "itaa-application",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_liteapi_hotels"]

[tool.uv.sources]
itaa-application = { workspace = true }
