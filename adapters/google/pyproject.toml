[project]
name = "itaa-google-adapter"
version = "0.8.1"
description = "Competition-specific Google adapter around the cloud-neutral ITAA core."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "itaa-application",
    "itaa-api",
    "itaa-domain",
    "itaa-contracts-generated",
    "fastapi==0.133.0",
    "pydantic==2.12.5",
    "httpx==0.28.1",
]

[project.optional-dependencies]
live = ["google-adk==2.7.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaa_google_adapter"]

[tool.uv.sources]
itaa-application = { workspace = true }
itaa-api = { workspace = true }
itaa-domain = { workspace = true }
itaa-contracts-generated = { workspace = true }
